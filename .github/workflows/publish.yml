name: publish

on:
  push:
    tags:
      - "v*"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate release tag matches crate version
        run: ./scripts/check-tag-version.sh "${GITHUB_REF_NAME}"

      - name: Re-run baseline repository verification
        run: ./scripts/verify.sh

      - name: Run crates.io publish dry-run when publishing is enabled
        if: ${{ vars.CLAP_TUI_PUBLISH_MODE == 'trusted-publishing' || vars.CLAP_TUI_PUBLISH_MODE == 'token' }}
        run: cargo publish -p clap-tui --locked --dry-run

      - name: Authenticate with crates.io using trusted publishing
        if: ${{ vars.CLAP_TUI_PUBLISH_MODE == 'trusted-publishing' }}
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish clap-tui with trusted publishing
        if: ${{ vars.CLAP_TUI_PUBLISH_MODE == 'trusted-publishing' }}
        run: cargo publish -p clap-tui --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish clap-tui with explicit token fallback
        if: ${{ vars.CLAP_TUI_PUBLISH_MODE == 'token' }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [[ -z "${CARGO_REGISTRY_TOKEN}" ]]; then
            echo "CRATES_IO_TOKEN is not configured." >&2
            exit 1
          fi
          cargo publish -p clap-tui --locked

      - name: Explain why publishing is still disabled
        if: ${{ vars.CLAP_TUI_PUBLISH_MODE != 'trusted-publishing' && vars.CLAP_TUI_PUBLISH_MODE != 'token' }}
        run: |
          echo "Tag validation and baseline verification passed."
          echo "Publishing is intentionally disabled until the release prerequisites are complete."
          echo "Set CLAP_TUI_PUBLISH_MODE=trusted-publishing for the default OIDC path,"
          echo "or CLAP_TUI_PUBLISH_MODE=token with CRATES_IO_TOKEN as the explicit fallback."
